version: 1.2.1
cache: true

# Only custom endpoint configured — no openAI/anthropic/google keys are set in
# .env, so no third-party provider shows up in the UI (NFR-3).
endpoints:
  custom:
    - name: "FinScale"
      apiKey: "${FINSCALE_SHIM_API_KEY}"
      baseURL: "${FINSCALE_SHIM_BASE_URL}"
      # The shim (./shim) serves /v1/models dynamically from config/clients.json,
      # so the dropdown always reflects current clients without editing this file.
      models:
        default: []
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "FinScale"
